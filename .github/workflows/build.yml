name: Build RayGram iOS

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Select Xcode
        run: |
          set -x
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          sudo chown -R runner:staff /Users/Shared/telegram-ios

      - name: Build the App via Bazel
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          # Generate configuration dynamically from secrets
          python3 -c "
          import os, json
          api_id = os.environ.get('API_ID') or '00000000'
          api_hash = os.environ.get('API_HASH') or '00000000000000000000000000000000'
          config = {
              'bundle_id': 'ph.telegra.Telegraph',
              'api_id': str(api_id).strip(),
              'api_hash': str(api_hash).strip(),
              'team_id': 'C67CF9S4VU',
              'app_center_id': '0',
              'is_internal_build': 'false',
              'is_appstore_build': 'true',
              'appstore_id': '686449807',
              'app_specific_url_scheme': 'tg',
              'premium_iap_product_id': '',
              'enable_siri': False,
              'enable_icloud': False
          }
          with open('build-system/raygram_configuration.json', 'w') as f:
              json.dump(config, f, indent=4)
          "

          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/raygram_configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --outputBuildArtifactsPath="$OUTPUT_PATH" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          if [ -f "$OUTPUT_PATH/Telegram.ipa" ]; then
            cp "$OUTPUT_PATH/Telegram.ipa" "$OUTPUT_PATH/RayGram.ipa"
          else
            echo "Searching for built IPA..."
            find bazel-bin bazel-out . -name "Telegram.ipa" -exec cp {} "$OUTPUT_PATH/Telegram.ipa" \;
            [ -f "$OUTPUT_PATH/Telegram.ipa" ] && cp "$OUTPUT_PATH/Telegram.ipa" "$OUTPUT_PATH/RayGram.ipa"
          fi

          echo "Artifacts directory contents:"
          ls -la "$OUTPUT_PATH"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RayGram-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/*.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          name: RayGram v${{ env.APP_VERSION }} (Build ${{ env.BUILD_NUMBER }})
          body: |
            ### RayGram iOS (Clean Official Telegram 13.0 Source Build)
            - **App Version:** ${{ env.APP_VERSION }}
            - **Build Number:** ${{ env.BUILD_NUMBER }}
            - **Target:** iOS Device (ARM64)
            - **Built with API ID:** ${{ secrets.API_ID || 'Configured in raygram_configuration.json' }}
          files: |
            /Users/Shared/telegram-ios/build/artifacts/RayGram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
